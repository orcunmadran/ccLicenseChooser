<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Creative Commons Türkiye">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="title">Creative Commons Türkiye</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .step-number {
        position: absolute;
        left: -15px;
        top: 15px;
        width: 30px;
        height: 30px;
        background-color: #6c757d;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.9rem;
        z-index: 10;
        box-shadow: 0 0 0 3px #fff;
    }

    .step-number.completed {
        background-color: #28a745;
        font-size: 0;
    }

    .step-number.completed::before {
        content: "\2713";
        font-size: 1.2rem;
    }
</style>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="https://creativecommons.org.tr/" target="_blank">
                <img src="img/cc_logo_turkiye.png" alt="Creative Commons Türkiye Logo" style="height: 30px;">
            </a>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-i18n-key="languageButton">
                    Language
                </button>
                <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h1 data-i18n-key="welcome"></h1>
        <p class="lead" data-i18n-key="description"></p>
    </div>

    <hr>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-5">
                <div class="text-center">
                    <h2 data-i18n-key="processTitle"></h2>
                </div>
                <div id="step1" class="mb-3 bg-light p-3 rounded text-center position-relative">
                    <div class="step-number">1</div>
                    <h3 class="h5" data-i18n-key="step1Question"></h3>
                    <div class="d-inline-block text-start">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="attribution" id="attribution_yes" value="yes">
                            <label class="form-check-label" for="attribution_yes" data-i18n-key="step1OptionYes"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="attribution" id="attribution_no" value="no">
                            <label class="form-check-label" for="attribution_no" data-i18n-key="step1OptionNo"></label>
                        </div>
                    </div>
                </div>
                <div id="step2" class="mb-3 bg-light p-3 rounded text-center position-relative">
                    <div class="step-number">2</div>
                    <h3 class="h5" data-i18n-key="step2Question"></h3>
                    <div class="d-inline-block text-start">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="commercial" id="commercial_yes" value="yes">
                            <label class="form-check-label" for="commercial_yes" data-i18n-key="step2OptionYes"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="commercial" id="commercial_no" value="no">
                            <label class="form-check-label" for="commercial_no" data-i18n-key="step2OptionNo"></label>
                        </div>
                    </div>
                </div>
                <div id="step3" class="mb-3 bg-light p-3 rounded text-center position-relative">
                    <div class="step-number">3</div>
                    <h3 class="h5" data-i18n-key="step3Question"></h3>
                    <div class="d-inline-block text-start">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="derivatives" id="derivatives_yes" value="yes">
                            <label class="form-check-label" for="derivatives_yes" data-i18n-key="step3OptionYes"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="derivatives" id="derivatives_sa" value="sa">
                            <label class="form-check-label" for="derivatives_sa" data-i18n-key="step3OptionSA"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="derivatives" id="derivatives_no" value="no">
                            <label class="form-check-label" for="derivatives_no" data-i18n-key="step3OptionNo"></label>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button id="resetButton" class="btn btn-danger" style="display: none;" data-i18n-key="resetButton"></button>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="sticky-top text-center" style="top: 20px;">
                    <h2 data-i18n-key="selectedLicense"></h2>
                    <div id="licenseResult" class="mt-3 p-3 border rounded bg-white">
                        <p class="text-muted fst-italic" data-i18n-key="noLicenseSelected"></p>
                    </div>

                    <div id="metadataSection" class="mt-4" style="display: none;">
                        <h3 class="h4" data-i18n-key="attributionMetadataTitle"></h3>
                        <div class="p-3 border rounded bg-white text-start">
                            <div class="mb-3">
                                <label for="workTitle" class="form-label" data-i18n-key="workTitleLabel"></label>
                                <input type="text" class="form-control" id="workTitle">
                            </div>
                            <div class="mb-3">
                                <label for="creatorName" class="form-label" data-i18n-key="creatorLabel"></label>
                                <input type="text" class="form-control" id="creatorName">
                            </div>
                             <div class="mb-3">
                                <label for="workUrl" class="form-label" data-i18n-key="workLinkLabel"></label>
                                <input type="url" class="form-control" id="workUrl">
                            </div>
                            <div class="mb-3">
                                <label for="creatorUrl" class="form-label" data-i18n-key="creatorLinkLabel"></label>
                                <input type="url" class="form-control" id="creatorUrl">
                            </div>
                            <div class="mb-3">
                                <label for="creationYear" class="form-label" data-i18n-key="yearLabel"></label>
                                <input type="text" class="form-control" id="creationYear" maxlength="4">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <h3 class="h4 mb-0" data-i18n-key="htmlNoticeTitle"></h3>
                            <button id="copyButton" class="btn btn-sm btn-secondary" style="display: none;" data-i18n-key="copyButton"></button>
                        </div>
                        <div id="htmlResult" class="mt-2">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <hr class="mt-5">

    <footer class="container text-center py-4">
        <div class="row">
            <div class="col-lg-12">
                <p class="text-muted" data-i18n-key="footerText"></p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script async
        src="https://z2fmflhwciklvujqnaejy6wx.agents.do-ai.run/static/chatbot/widget.js"
        data-agent-id="90c97156-1182-11f1-b074-4e013e2ddde4"
        data-chatbot-id="w7vIFoBzTxfRafC53E62cMAkZZxXKBC1"
        data-name="Creative Commons Türkiye"
        data-primary-color="#031B4E"
        data-secondary-color="#E5E8ED"
        data-button-background-color="#0061EB"
        data-starting-message="Merhaba size nasıl yardımcı olabilirim?"
        data-logo="/static/chatbot/icons/default-agent.svg">
    </script>
</body>
</html>
